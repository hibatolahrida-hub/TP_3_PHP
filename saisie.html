<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Saisie des notes</title>
</head>
<body>
    <h2>Saisie des notes des apprenants (POST)</h2>
    <form action="traitement.php" method="post">
        <label>Nom de l'apprenant :</label>
        <input type="text" name="nom" required><br><br>

        <label>Note Informatique :</label>
        <input type="number" step="0.5" name="note_info" required><br><br>

        <label>Note Mathématiques :</label>
        <input type="number" step="0.5" name="note_math" required><br><br>

        <button type="submit">Valider et enregistrer</button>
    </form>
</body>
</html>
