
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Saisie des notes</title>
</head>
<body>

    <h1>Saisie des notes</h1>

    <form action="traitement.php" method="POST">
        <label for="nom">Nom :</label>
        <input type="text" id="nom" name="nom" required>
        <br><br>

        <label for="note_info">Note informatique :</label>
        <input type="number" id="note_info" name="note_info"
               min="0" max="20" step="0.01" required>
        <br><br>

        <label for="note_math">Note mathématiques :</label>
        <input type="number" id="note_math" name="note_math"
               min="0" max="20" step="0.01" required>
        <br><br>

        <button type="submit">Envoyer</button>
    </form>

</body>
</html>
